; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Spot price Tibber"
K02 = "Fetches the hourly electricity prices from your own <b>Tibber account</b>, together with the consumption history and — with a <b>Tibber Pulse</b> — the instantaneous power every second. All of it goes to Loxone: through MQTT and through a token-protected HTTP endpoint."
K03 = "What comes first"
K04 = "<b>Get a token.</b> Sign in at <span class='sm-mono'>developer.tibber.com</span> with your own Tibber account, then create one under <i>Access Token</i>."
K05 = "<b>Settings:</b> enter the token and save."
K06 = "<b>Test, button <i>Check account data</i>.</b> This is the most important click: it tells you in one line whether the token is accepted, what the home is called and whether a Pulse is connected."
K07 = "<b>Test, button <i>Fetch prices now</i></b> — otherwise you wait for the next cycle."
K08 = "<b>MQTT:</b> enter the subscription in the gateway. Without that entry nothing arrives at the Miniserver. <b>This applies to MQTT&#8209;Gateway&nbsp;V1.</b> From version&nbsp;2 on, the topic group appears in the subscriptions by itself; there is then nothing to enter."
K09 = "<b>Loxone integration:</b> create the import file, then rebuild the five pages from the LoxBerry plugins sample project – each with step-by-step instructions, table and image."
K10 = "The difference to aWATTar and Octopus"
K11 = "<b>Tibber supplies the final price ready-made</b> — including taxes and levies. With an exchange price you have to add the grid fee, electricity tax, levies and VAT yourself; not here. That is why there is no price calculator, only a <i>surcharge</i> that is set to 0 by default."
K12 = "The <b>energy share</b> and the <b>tax share</b> are still carried separately. That is not decoration: <b>only the energy share can go negative</b>, never the final price. If you want to react to negative prices, evaluate <span class='sm-mono'>NEG</span>, not <span class='sm-mono'>CUR</span>."
K13 = "Where the quantities are the same, the field names for Loxone are <b>the same as in the Spot price aWATTar and Octopus plugins</b>. If you change supplier, you swap the plugin — not the blocks."
K14 = "Two price levels, and why"
K15 = "<span class='sm-mono'>LEVEL</span> is the level according to <b>your</b> thresholds (cheap / normal / expensive). <span class='sm-mono'>TLEVEL</span> is what <b>Tibber itself</b> makes of it — Tibber compares against the last few days, you compare against a fixed number. On a day that is expensive throughout, Tibber will still say 'cheap' at some point, your threshold will not. Both are useful, so both are provided."
K16 = "The Tibber Pulse"
K17 = "The instantaneous values arrive over a <b>permanent connection</b>, not through polling. A separate service handles that, started on the <i>Settings</i> tab. Without a Pulse or Watty these values do not exist — that is <b>not a malfunction</b>, and the Test tab says so explicitly instead of marking a failure."
K18 = "A Pulse value older than two minutes is <b>no longer published</b>. An instantaneous power reading from three hours ago is not an instantaneous reading."
K19 = "Tariff comparison"
K20 = "The average price of the month is formed from <b>cost divided by consumption</b>, not as the mean of the hourly prices. That is the difference between 'what would it have cost' and 'what did it cost': anyone who does the laundry at night pays less than the daily average, and that is exactly what the comparison is meant to show."
K21 = "The <b>standing charge is not included</b>. What is compared are energy prices; the standing charge merely appears alongside in the monthly report."
K22 = "What has not been tested"
K23 = "This version has not been measured against <b>any</b> Tibber account. What is proven are the calculations — they run against fixed reference values in the self-test — and the WebSocket implementation, whose frame construction was held against an independent implementation of RFC 6455. What is not proven is whether the token is accepted and whether the field names of this version still match the interface. The <i>Check account data</i> button answers that in one line."
K24 = "Backup and restore"
K25 = "Two buttons on the <i>Settings</i> tab: one downloads the whole configuration as a file, the other plays it back. The file carries <b>both secrets</b> — the Tibber token and the endpoint keyword. That is deliberate: without them every field would be correct after a restore and the plugin would still reach neither the prices nor the Miniserver. Treat the file like a password."
K26 = "A restore is <b>all or nothing</b>. If a single value fails the check — outside the permitted range, an unknown key, a line break in the MQTT topic — the old configuration stays untouched and the reason is named. A half-applied configuration is worse than the old one."
K27 = "After the update: read the Loxone import file in again"
K28 = "Up to version&nbsp;0.9.6 two fields read the wrong value: Loxone searches literally and takes the first match, and <span class='sm-mono'>ALTER</span> is a suffix of <span class='sm-mono'>PULSE_ALTER</span>, <span class='sm-mono'>OK</span> one of <span class='sm-mono'>MORGEN_OK</span>. That is fixed — but the search text sits in the <b>already imported</b> inputs, not in the plugin. Generate the import file again on the <i>Loxone integration</i> tab, delete the old virtual inputs and read the file in once more. Skipping this leaves you with two misread values — without any error message, because both still deliver a plausible number."
K29 = "Quarter-hourly prices"
K30 = "Since 01.10.2025 quarter-hourly products exist in Germany, and Tibber delivers them. The step width is therefore <b>not assumed but measured</b>, from the spacing of the delivered entries. Window search, rank and the price for the current period all use what actually arrives. With hourly prices nothing changes; over MQTT quarter-hours are averaged into hourly values so that existing blocks keep working. The same applies to the hourly prices PH00 to PH23 of the status line (since 0.9.32) for the Loxone block Spot Price Optimizer."
K31 = "The scheduler"
K32 = "The <i>Scheduler</i> tab holds four switching rules. Each answers, for one appliance, the question “is it running cheaply now?” and hands the Miniserver a ready-made 0/1 signal — <span class='sm-mono'>R1</span> to <span class='sm-mono'>R4</span>."
K33 = "<b>Everything is off by default.</b> As long as no rule is switched on, the scheduler computes nothing, fetches nothing and writes nothing. So you can just look around first."
K34 = "<b>Start with one rule.</b> Tick the box, give it a name, pick the type — “the cheapest single hours” is usually right for a battery or a wallbox, “the cheapest contiguous window” for a washing machine or dishwasher. Everything below can stay as it is for now."
K35 = "<b>The power budget pays off from the second rule onwards.</b> Without it every rule finds the same cheapest hour and they all switch on together. With it, rank 1 picks first, and whoever no longer fits moves to the next hour. The schedule as it looks right now is at the bottom of the page — there you see immediately who runs when."
K36 = "<b>The PV forecast is the finishing touch, not the starting point.</b> It moves the schedule into the sunny hours, and everything else works just as well without it. If you do set it up: with forecast.solar the “path within the JSON” field stays empty, and the unit is <span class='sm-mono'>Wh per interval</span>. Picking the wrong unit is off by a factor of a thousand."
K37 = "House standard since 0.9.33: gateway V2, electricity price to other plugins, storage level"
K38 = "New setups use the <b>MQTT gateway V2</b>: tab <i>MQTT</i> lists the data points to tick with their names in Loxone; tab <i>Test</i> checks the ticks. The tick <b>Give the electricity price to other plugins</b> makes this installation the provider of <span class='sm-mono'>haus/strompreis</span> – but only if no other spot price plugin is the provider; otherwise it waits until you press <b>This installation shall be the provider</b>. Nothing ever switches over on its own. In tab <i>Scheduler</i> the storage level can come from the storage plugin (<span class='sm-mono'>haus/speicher</span>). The HTTP endpoint is off on a new installation and stays on with an update."
K39 = "<b>Several speakers at once</b> (since 0.9.33, speech module 1.2.1): below the output type (now “target 1”) the table <i>Further outputs (simultaneous)</i> takes up to 6 targets in total, for example Loxone Music Server, Google speakers (Chromecast 4 Lox NG) and Amazon Echo (Alexa-NG). Every announcement goes to target 1 and to every enabled target of the table at the same time; if one fails the others still speak, and the announcement counts as sent as soon as one has spoken (the log and the Test tab name every target). If target 1 is off, none speaks; the original Audio Server as target 1 cannot be combined with further targets. New target: fill in the empty row and save. Several zones of the same Music Server or several Echos belong in ONE target (zone list, comma list, gruppe:&lt;name&gt;). The speech token is entered once above and applies to all targets of that kind. In the Test tab <i>Test announcement</i> speaks to all targets, <i>Test announcement to target n</i> only to that one. Before going back to a version older than 0.9.33 remove the further targets – older versions do not know the list and would fall back to the factory settings of the speech output."
K40 = "Threshold push (since 0.9.43, off by default)"
K41 = "One message when the price <code>CUR</code> of your own contract falls below a threshold of your own, and one when it rises above threshold + hysteresis again – independent of <code>LEVEL</code> and the announcement times, with a lock time per direction. The Miniserver sends the push via a notification block on <code>SCHWELLE_MELDUNG_UNTER</code> or <code>SCHWELLE_MELDUNG_UEBER</code> (MQTT <code>schwelle/meldung_unter</code>, <code>schwelle/meldung_ueber</code>), each 1 for five minutes; <code>SCHWELLE_UNTER</code> or <code>schwelle/unter</code> (retained) tells whether the price is below the threshold right now. The same names as in Spotpreis aWATTar and Octopus Dynamic. Every trigger is a line in the log, the Test tab recalculates the state sequence. After switching on and after every change of threshold or hysteresis the initial state is taken over without a message."
