H_STROMPREIS = "Off by default, only works with “values via MQTT”. Sends the final prices as shown in the plugin (Tibber total price plus your own surcharge) from the current hour, at most 36 hours, in the grid Tibber delivers (900 for quarter hours, otherwise 3600) – via a short session directly at the broker, e.g. for Marstek Venus E, MGiSmart or the car plugins. Only ONE spot price plugin in the house is the provider: this installation only starts on its own if there is no other provider; otherwise it waits until you press “This installation shall be the provider” below. When switched off, the topics are cleared with read-back – only if this installation was the provider."
L_ENDPUNKT = "HTTP endpoint switched on (previous way via the HTTP template)"
H_ENDPUNKT = "New setups take the values via the MQTT gateway V2 (table below). On a new installation the endpoint is off, on an update it stays on. Off means: every request answers <span class='sm-mono'>FEHLER;OK=0;GRUND=ENDPUNKT_AUS</span>."
L_SPEICHER = "Take the storage level from the storage plugin (haus/speicher, e.g. Marstek Venus E or Zendure SolarFlow)"
H_SPEICHER = "Reads via the MQTT broker of the LoxBerry (works without “values via MQTT” too). If the source is silent for more than 2 minutes or reports −1, the storage address below applies (if entered). Off by default."
STAND_HAUS = "Storage level from the house (haus/speicher)."
HAUS_SCHWEIGT = "Storage level from the storage plugin (haus/speicher) is silent – storage address used."
HAUS_SCHWEIGT_OHNE = "Storage level from the storage plugin (haus/speicher) is silent and no storage address is entered – no storage level."
M_GELEERT = "haus/strompreis: %d topics cleared (confirmed by the broker)."
M_NICHTS = "haus/strompreis: nothing to clear (the broker retains none of the topics)."
M_REST = "haus/strompreis: still retained: %s – the minute run tries again every 10 minutes."
M_KEIN_BROKER = "haus/strompreis: broker not reachable – the minute run tries the clearing every 10 minutes."
M_WARTETE = "haus/strompreis: this installation was not the provider – the topics of the other provider stay untouched."
T_AUS = "off – tick “Give the electricity price to other plugins” in tab MQTT."
T_MQTT_AUS = "off – MQTT is switched off."
T_NIE = "no session yet – the next minute run sends."
T_BROKER = "broker not reachable (%s), last attempt %d s ago."
T_OK = "last sent %d s ago, %d values from %s, grid %d."
T_OHNE_PREISE = "last sent %d s ago – without prices for the current slot (vorschau “-”, ab −1)."
S_AUS = "off – tick “Take the storage level from the storage plugin” in tab Scheduler."
S_HAUS = "from the house (haus/speicher): %s %%, counter %d s ago."
S_SEIT = "source silent for %d min"
S_NIE = "source never heard"
S_URL = "%s – storage address used."
S_KEINE = "%s – no storage address entered, no storage level."
A_FREI = "Provider (nobody else was provider)."
A_EIGEN = "Provider."
A_GEWAEHLT = "Provider (chosen with the button)."
A_PRUEFE = "waiting – still checking whether another plugin is the provider (up to two minutes)."
A_BESTAND = "not sending – another plugin already sends haus/strompreis (without a name). Take over with the button and switch its tick off there."
A_FREMD_LEBT = "not sending – the provider is %s. Take over with the button if this tariff shall apply."
A_FREMD_SCHWEIGT = "not sending – the provider is %s but has been silent for over 2 minutes. Nothing switches over on its own: press the button to take over."
A_ABGELOEST = "no longer sending – replaced by %s. The topics now belong to the new provider; nothing is cleared."
A_VERALTET = "situation unclear – the reader of the house topics has delivered nothing for over 5 minutes; the previous role stays."
H_ANBIETER = "Provider of haus/strompreis"
H_WAEHLEN = "Only you know which tariff applies. The button makes this installation the provider; another spot price plugin that knows the rule then stops on its own. aWATTar up to 1.2.39 does not know it yet – switch off “Give the electricity price to other plugins” there, otherwise it takes over again with its next full send."
K_WAEHLEN = "This installation shall be the provider"
W_ERST_HAKEN = "First switch on “Give the electricity price to other plugins” and “values via MQTT” and save."
W_BROKER = "The broker was not reachable (%s) – nothing changed."
W_OK = "This installation is now the provider of haus/strompreis (before: %s); the next minute run sends all values."
W_FREMD_LEBT = "%s was sending until now – if that plugin does not know the provider rule, switch its tick off there."
W_BESTAND = "A plugin without a name was sending until now – switch its tick off there."

