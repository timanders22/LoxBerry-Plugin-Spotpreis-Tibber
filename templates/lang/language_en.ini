WAS_IST_DAS = "<b>The hourly electricity prices from your own Tibber account in Loxone.</b> A minute schedule on the LoxBerry fetches the prices as well as the consumption history with costs through the Tibber interface; with a Tibber Pulse, a separate service also records the momentary power every second. Everything goes to the Miniserver – through a token-protected HTTP endpoint (the way of the block lists) or over MQTT through the MQTT gateway (off by default); both ways deliver the same values. An access token of the Tibber account is required."
