[LOX]
ADRESSE_VORSCHLAG = "The address above is a <b>suggestion</b>. The host name your browser is using right now need not be the one the Miniserver uses to reach the LoxBerry. When in doubt enter the fixed IP address of the LoxBerry."
EINLEITUNG = "This page builds the integration step by step. Working through it from top to bottom leaves you with a Miniserver that knows the electricity price, recognises cheap hours and releases loads accordingly."
EP_JSON = "Everything at once as JSON — for your own analysis, not for a virtual input"
EP_PULSE = "Instantaneous values from the Tibber Pulse. OK=0 means the last value is older than two minutes and no longer valid."
EP_STATUS = "All key figures in one line. This is the address for the virtual input."
EP_STUNDEN = "All hourly prices for today and tomorrow, one line per hour"
EP_VERBRAUCH = "Daily consumption and cost from the Tibber history"
H_TITEL = "Loxone integration"
IMPORT_WARNUNG = "<b>Loxone Config creates new objects on import and overwrites nothing.</b> Importing twice means duplicate objects. Delete the old ones before a second import."
K_TOKEN_NEU = "Roll a new token"
K_VORLAGE = "Create the import file for Loxone Config"
S1_TEXT = "There are two ways and they do not exclude each other. <b>MQTT is the standard way:</b> the gateway creates the names of the virtual inputs itself, so a suitably named input in Loxone is enough. <b>The HTTP endpoint</b> returns all key figures in a single request and is often clearer — and it also offers the hourly list and the consumption history, which only partly arrive over MQTT. If you only need the current price, use MQTT; if you evaluate the daily curve, use the endpoint."
S1_TITEL = "Step 1: Choose the way"
S2_TEXT = "Only needed if you use the MQTT way. The topic group of this plugin is:"
S2_TITEL = "Step 2: The subscription in the MQTT gateway"
S2_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b>"
S3_BEFEHLE = "<p>The command recognitions for the virtual input. The button below generates them ready made as an import file — the table stays all the same, because it explains what is being imported.</p>"
S3_STRICH = "A <b>dash</b> instead of a number means this value is not available. No 0 is sent on purpose, because a 0 would be a silent false statement — particularly with an electricity price, where 0 ct looks like a very good deal. On a dash Loxone keeps the previous value."
S3_TEXT = "In Loxone Config create a <b>Virtual HTTP Input</b>. Address and polling cycle:"
S3_TITEL = "Step 3: Create the virtual inputs"
S4_TEXT = "The endpoint sits in the unauthenticated area so that Loxone can reach it without credentials, and it is protected by a token. The comparison uses <span class='sm-mono'>hash_equals</span>, that is, in constant time. <b>It is read-only</b> — there is nothing to switch here, and an endpoint in the unauthenticated area that could do more than read would be an attack surface without any benefit."
S4_TITEL = "Step 4: The endpoints at a glance"
S4_TOKEN = "<p><b>A new token invalidates every address in the Miniserver.</b> After rolling one you have to update them by hand in Loxone Config. So only roll one if the token has genuinely leaked.</p>"
S5_TEXT = "Virtual inputs in Loxone keep their last value. If the fetch fails, everything looks normal in the app — the price merely stops moving, and an automation would keep acting on yesterday's price. Two values give it away: <span class='sm-mono'>ALTER</span> rises and <span class='sm-mono'>OK</span> drops to 0. Both belong in your logic, see blocks 7 to 13. <b>Set the threshold well above the fetch interval</b> so that a single missed run triggers nothing."
S5_TITEL = "Step 5: Failure detection"
S6_ERLAEUTERUNG = "<h3>On the individual rows</h3><p><b>On 9 and 10:</b> Two different failure pictures. #9 means the fetch runs but no longer gets fresh prices. #10 means the last fetch explicitly failed. Both lead to the same message and are therefore merged in #11.</p><p><b>On 11:</b> <b>Never wire several sources straight into the input of the notification block.</b> It only fires on a change from off to on; a permanently active source would swallow all the others. Merge them through OR first.</p><p><b>On 15 and 17:</b> Two routes to the same question, and they answer it differently. #15 asks for an absolute price — good when an appliance only pays off below a certain price. #17 asks for the rank — good when the washing has to happen anyway and you only want the best moment of the day. On an expensive day #15 never releases, #17 always does. That is why both are there, joined by OR; if you only want one, leave the other out.</p><p><b>On 20:</b> The third input is the failure detection, negated. Without it a stale price would still release loads.</p><p><b>On 21:</b> The on delay prevents chattering at the threshold. Two minutes is enough; the price only changes hourly anyway.</p><p><b>On 23 and 24:</b> <span class='sm-mono'>FENSTER_IN</span> counts the hours until the cheapest window. When it reaches 0 the window is starting — that becomes a pulse you can use to start a machine or send a message.</p><p><b>On 28 to 30:</b> Only useful with a Tibber Pulse. Instantaneous power times final price gives the cost per hour in ct — kept as a statistic it shows which load actually costs money. Without a Pulse these three rows are omitted.</p><p><b>Loxone time base:</b> Loxone counts seconds since 2009-01-01. If a time block supplies Unix time (a value around 1.7 billion), subtract <span class='sm-mono'>1230768000</span>.</p><p>Loxone Config finds every block through the block search with <b>F5</b>.</p>"
S6_TEXT = "<b>Mandatory part.</b> Working through this table from top to bottom rebuilds the function without having to think. Rows 1 to 13 are values and failure detection and are always worth it. Rows 14 to 27 release loads at cheap times. Rows 28 to 30 need a Tibber Pulse and can otherwise be omitted."
S6_TITEL = "Step 6: Complete block list for rebuilding"
S7_TEXT = "Call these three addresses in a browser. The first must return values, the other two must be rejected. If one of the last two is answered, something is wrong with the endpoint."
S7_TITEL = "Step 7: Cross check"
TOKEN_NEU = "A new token has been rolled. Every address in the Miniserver has to be updated now."
