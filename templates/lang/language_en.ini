[TB_MQTT]
STUNDE = "Final price of a single hour today. N is the hour from 0 to 23."
S_OK = "Heartbeat: 1 as long as the last successful price fetch is at most three times the fetch interval old (at least two hours). Goes out on EVERY run, even when nothing else changed."
S_TS = "Heartbeat: timestamp of the last fetch in Unix seconds. There is no age over MQTT — when sending it would always be zero. The Miniserver computes it: age = (Loxone time + 1230768000) − ts."
S_ZAEHLER = "Heartbeat: run counter 0 to 999, wrapping. It answers what the timestamp cannot — a Raspberry without a real time clock jumps at the first time sync."
S_PULSE_TS = "Heartbeat: timestamp of the last Pulse reading in Unix seconds, 0 if there is none. Here too no age is published but the timestamp — an age ticks on every second and would have rendered the duplicate filter useless."





