; Short labels for the fields. They become the comment of the import template, and Loxone Config turns that into the DISPLAY NAME of the block - hence a name, not a sentence. The explanation lives in [TB_FELD].
ZAEHLER = "Counts up on every cron run, 0 to 999 and around; -1 means it has never run. A block watching for unchanged for N minutes detects a stalled fetch by this — even when the clock of the LoxBerry has just jumped and an age is therefore worthless."
FENSTER2_H = "Start of the second cheapest window that does not overlap the first. Empty while the price list does not carry a second one."
FENSTER2_IN = "Hours until the second window starts"
FENSTER2_CT = "Average price in the second window"
FENSTER_MORGEN_H = "Start of the cheapest window TOMORROW, once those prices are available. This allows deciding in the evening whether to charge today or wait for tomorrow."
FENSTER_MORGEN_CT = "Average price in the cheapest window tomorrow"
AVG_30T = "Average price of the last 30 days from the plugin history. Empty while the series is too short — an average of three points would look like a monthly average and would not be one."
RANK_30T = "How cheap the current hour is measured against the last 30 days: 0 per cent means cheaper than ever, 100 per cent dearer than ever. This is what a fixed threshold cannot tell you."
GUENSTIGANTEIL = "Share of yesterday consumption that fell into hours below your own cheap threshold. Only formed when at least 20 hourly values for yesterday are available — a fragment does not make a daily balance."
ERSPARNIS_GESTERN = "What the dynamic tariff brought yesterday compared with the fixed price entered. Positive means saved. Empty while the hourly values for yesterday are incomplete."
BUDGET = "The configured power budget in kilowatts shared by all rules together. 0 means no budget."
PLANLAST = "How many kilowatts are scheduled for the current hour — the sum of the power of all rules running right now."
PVSUM = "Expected PV yield over the next 24 hours in kilowatt-hours, from the configured forecast source. With no source configured nothing is sent — not 0, because 0 would be a statement about the sun that nobody made."
R1_AKTIV = "Rule 1 is running: 1 means the current hour is part of this rule’s schedule. This is the value to wire to a digital input in Loxone."
R1_CT = "Average price of the hours the scheduler picked for rule 1."
R1_IN = "Hours until the next block of rule 1. 0 means it is running now, -1 means no block is planned within the horizon."
R1_REST = "Hours remaining in the current block of rule 1. 0 means it is not running."
R1_SPERRE = "Why rule 1 stays silent: 0 no lock, 1 the PV forecast is high enough, 2 the battery is too empty, 3 the battery is too full."
R1_VERD = "How many hours the power budget took away from rule 1 because a higher-ranked rule had claimed them first. 0 means the rule got what it needed."
R2_AKTIV = "Rule 2 is running: 1 means the current hour is part of this rule’s schedule. This is the value to wire to a digital input in Loxone."
