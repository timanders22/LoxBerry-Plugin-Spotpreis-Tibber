; Spotpreis Tibber - English language file
;
; English is the FALLBACK language, not German: whoever runs a third language
; is more likely to understand English. This file must always be complete.
;
; Rules (house standard): every value in double quotes, no further double
; quote inside a value (quote HTML attributes with single quotes), every key
; used in the PHP code present in BOTH language files.

