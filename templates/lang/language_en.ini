[SCHWELLE]
TITEL = "Threshold push (independent of the hours)"
EIN = "Switch on threshold push"
CT = "Threshold in ct/kWh"
HYST = "Hysteresis in ct/kWh"
SPERRE = "Lock time in minutes (per direction)"
H_EIN = "Reports once when the price falls below the threshold (field SCHWELLE_MELDUNG_UNTER, MQTT schwelle/meldung_unter) and once when it rises above threshold + hysteresis again (SCHWELLE_MELDUNG_UEBER, schwelle/meldung_ueber) – each 1 for five minutes. The Miniserver sends the push: attach a notification block to this input (tab “Integration into Loxone”). SCHWELLE_UNTER or schwelle/unter (retained) is 1 as long as the price is below the threshold. Off by default; after switching on and after every change of threshold or hysteresis the initial state is taken over without a message – only a change is reported."
H_CT = "Reported as soon as the price is lower than this value. -100 to 200."
H_HYST = "“Back above” only when the price is higher than threshold + hysteresis – against flapping around the threshold. 0 to 50."
H_SPERRE = "After a message, no second one of the same direction comes within this time; the state still follows the price. 0 (no lock) to 1440."
