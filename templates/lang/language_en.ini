ABO_V2 = "<b>MQTT gateway V2 detects the topic group by itself</b> — nothing needs to be entered here. The group appears under <i>Subscriptions</i>; tick the data points you want there. If it does not appear, nothing has been published yet."
ABO_WARNUNG = "<b>Without this entry nothing arrives at the Miniserver.</b> This is the single most common cause of failure: the gateway runs, the plugin sends, and Loxone still shows nothing. The line belongs under <i>System → MQTT Gateway</i> in the <i>Subscriptions</i> section; save afterwards."
