EINHEIT_W = "W average power"
EINHEIT_WH = "Wh per interval (forecast.solar)"
ERKLAERUNG = "Up to 0.9.10 this plugin could say which hours are cheap — but not which appliance gets them. The scheduler changes three things: a rule can have a <b>deadline</b> and an amount of energy, several rules share a <b>power budget</b> by rank, and a <b>PV forecast</b> moves the schedule into the sunny hours. All three are off by default — if you configure nothing, you get the behaviour of the previous version."
GESPEICHERT = "Scheduler settings saved."
H_AKTIV = "Without the tick the rule stays but is not computed and permanently reports 0. Its settings are not lost."
H_BUDGET = "This much all switching rules together may draw at the same time. A rule that wants more than is left does not get the hour and moves to the next one. 0 = off, then every rule computes on its own as before."
H_BUDGET2 = "For controllable consumer devices under German §14a EnWG: within the time window below this limit applies in addition, and the smaller of the two wins. 0 = off."
H_BUDGET2_ZEIT = "Same reading as a rule’s time window: from equals until means the whole day."
H_ENERGIE = "How much the rule needs in total. Together with the power this yields the number of hours — the “hours” field then no longer applies. 0 = off."
H_FRIST = "The rule must be finished by this hour. If it lies in the past it applies to the next day. -1 = no deadline. This is the difference between “wash cheaply at some point” and “wash cheaply, but by seven”."
H_GLOBAL = "What applies to all rules"
H_HORIZONT = "How far ahead to search. The scheduler does not plan beyond the horizon, even if the day after tomorrow would be cheaper."
H_HYSTERESE = "The scheduler gets a fresh price series on every call and could therefore decide differently each time. With this box ticked, a started block runs to its end even if an hour has become cheaper in the meantime. Without it an appliance can switch off mid-operation."
H_LEISTUNG = "What the appliance draws while the rule runs. 0 means the rule does not take part in the power budget and displaces nobody."
H_N = "For “cheapest window” the length of the window, for “cheapest single hours” their number. Without effect for the other two types."
H_NAME = "For this interface only. It does not change the block names in Loxone — those live in the import template and must not depend on a setting you might change tomorrow."
H_NEG = "What goes negative is the energy component, not the final price — that one contains taxes and therefore practically never goes negative."
H_PLANFELDER = "Ranking, demand and locks"
H_PROZENT = "Only for the type “below the daily average”: an hour must be this many percent below the average for the rule to run."
H_PV_BONUS = "Subtracted from an hour’s price when a PV forecast exists for it. This lets the sunny midday hour win over the cheap night hour. A sensible value is the difference between your purchase price and your feed-in tariff — what you save by using the electricity yourself. 0 = off."
H_PV_EINHEIT = "What a single value holds: an amount of energy per interval, or an average power. Chosen wrongly, the scheduler is off by a factor of a thousand."
H_PV_FELDER = "Only for the “list of records” shape. With Solcast they are called <span class='sm-mono'>period_end</span> and <span class='sm-mono'>pv_estimate</span>."
H_PV_PFAD = "Dot separated, for example <span class='sm-mono'>forecasts</span> or <span class='sm-mono'>result.watt_hours_period</span>. For forecast.solar leave it empty — the path is fixed there."
H_PV_QUELLE = "What shape the answer has. There is no common language for PV forecasts, hence three shapes instead of one."
H_PV_SCHWELLE = "The credit rises linearly up to this value and then stays flat. A plain yes-or-no threshold would be a cliff — the schedule would jump by hours on a slightly changed forecast."
H_PV_SPERRE = "If the forecast for the next 24 hours exceeds this value, the rule stays silent. This keeps the battery from charging up at night when the sun will shine tomorrow. 0 = off."
H_PV_URL = "For forecast.solar something like <span class='sm-mono'>https://api.forecast.solar/estimate/48.1/11.6/30/0/9.9</span> — latitude, longitude, tilt, azimuth, kWp. The free tier allows only a few calls per hour; this plugin asks at most every 15 minutes."
AZIMUT_LINK = "Open the azimuth tool (polka-umwelt.de, German): find the house, switch to the aerial view, choose „Orthogonales Messen“ (orthogonal measuring) and click along the ridge so that the arrow points to the roof face with the panels"
AZIMUT_PV = "The degrees shown („Abweichung von Süden“, deviation from south: 0 = south, east negative, west positive) count like forecast.solar and go unchanged into the orientation position of the address."
H_QUELLEN = "External sources"
H_RANG = "1 picks first, 99 last. On equal rank the order on this page decides. Rank only has an effect when there is a power budget — without one, every rule may use every hour."
H_REGELN = "The switching rules"
H_SCHWELLE = "Only for the type “below a threshold”: the rule runs in every hour whose final price is below it."
H_SOC_GRENZEN = "Both 0 means the battery charge does not matter for this rule. Without a configured battery source they have no effect anyway."
H_SOC_PFAD = "Dot separated, for example <span class='sm-mono'>werte.SOC</span>. If left empty, the first number between 0 and 100 whose key looks like a state of charge is used."
H_SOC_URL = "A JSON response holding the state of charge in percent somewhere — for example the endpoint of another LoxBerry plugin. Empty = off."
H_TAKTSCHUTZ = "Against short cycling, which harms heat pumps and compressors. Both in minutes, 0 = off. With hourly prices a value below 60 has no effect — it is not rejected either, since 0 already means off."
