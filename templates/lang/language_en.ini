RETAIN_ERKLAERUNG = "A <b>retained</b> topic stays in the broker: after a restart of the Miniserver or the gateway, Loxone immediately has the current state again. Only what stays true without a new message is retained — here just the fixed price you entered. Everything with a time reference is sent without retain: prices, windows, the values for tomorrow and yesterday, the current month and the 30-day comparison would become wrong at midnight, at the turn of the month or at the next hour without anyone noticing. After a restart they are missing until a value changes. The heartbeat is never retained."
ABGERAEUMT = "The retained topics under the previous prefix %s/ have been cleared – confirmed by the broker."
ABRAEUMEN_OFFEN = "The retained topics under the previous prefix %s/ were cleared, but the broker could not be read back. The prefix is noted; uninstalling clears it as well."
H_V2 = "Gateway V2: tick these data points"
V2_ERKLAERUNG = "With <b>MQTT gateway V2</b> only what is ticked in the gateway's <i>Subscriptions</i> reaches the Miniserver. This table is the list for it – topic, name of the virtual input in Loxone and whether <i>Noncached</i> must be set (for the heartbeat, “ok” and the hourly prices). Timestamps and values that are never sent with your settings (Pulse, consumption, rules not created) are left out on purpose. The line in the <i>Test</i> tab checks whether everything is ticked."
T_GATEWAYNAME = "Name in Loxone"
T_NONCACHED = "Noncached"
NONCACHED_JA = "yes"
NONCACHED_NEIN = "no"

