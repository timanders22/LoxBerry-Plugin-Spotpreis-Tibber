ZU = "About %s:"
BILD_ALT = "Blocks of the page “%s” in Loxone Config"
BILD_UNTERSCHRIFT = "Page “%s” in the LoxBerry plugins sample project. Config shortens long block names – see the table for the full names."
MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S1_SCHRITT1 = "In the plugin tab “Settings” enter the Tibber token (developer.tibber.com), save. Tab “Test” → “Fetch prices now”, then “Is a Tibber token stored?” and “Are the prices up to date?”: both ticked."
S1_SCHRITT2 = "Above in step 3, “Create the import file for Loxone Config”. In Loxone Config: Periphery → Virtual Inputs → import template. Read it in only ONCE (twice gives duplicate inputs). The container “Spotpreis Tibber” brings all %d values and serves all five pages. If the address contains a host name the Miniserver does not know: enter the fixed IP of the LoxBerry."
S1_SCHRITT3 = "Create the page “Spotpreis Tibber”. Drag the 11 commands of the list from the container (no. 1–11), plus the constant 1 (no. 12). Switch on “Statistics” at TIBBER_CUR in the properties window."
S1_SCHRITT4 = "Create two sliders (“Preisgrenze für Freigabe (Tibber)”, “Rang-Grenze (Tibber)”) and one switch (“Lastverschiebung freigegeben (Tibber)”) as virtual inputs – values as in the list. Create the memory flag “Freigabe Lastverschiebung (Tibber)” (in the tree “Memory Flags”, ribbon “Memory Flags”, click on the page). Create two notifications (Periphery → Messages → Notification): “Meldung Spotpreis gestört (Tibber)” and “Meldung Strompreis negativ (Tibber)”, text as in the list."
S1_SCHRITT5 = "Place the other blocks with the block search (F5), parameters as in the list, connect from top to bottom; OR and AND have two inputs each. “(inverted)” means: in Config click on the input point of the AND – it then shows a small circle (this is not a tick in the properties window; a tick only exists for parameter inputs such as ‘En’). Value Validator no. 15: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0). Status “Strompreis jetzt (Tibber)”: click “+” four times first (V5–V8), “Spotpreis-Zustand (Tibber)” twice (V5, V6). Status lines and message texts are in the table and are entered by hand, the line without condition last."
S1_SCHRITT6 = "Save and transfer. Check: “Spotpreis-Zustand (Tibber)” shows “läuft – Preise … min alt”; TIBBER_ZAEHLER goes up by about 5 every 5 minutes. Switch on “Lastverschiebung freigegeben (Tibber)” – in a cheap hour the flag goes to 1 after 2 minutes."
S1_ZU_IMPULS = "A threshold switch behind a polled input gives a short pulse at every poll; the switch-on delay no. 18 in front of the message swallows it."
S1_ZU_STEHT = "If the LoxBerry stops, every input keeps its last value – OK and ALTER too; only the stopped run counter gives it away. That is why the message and the release hang on the Value Validator."
S1_ZU_ODER = "Never connect several sources directly to the input of a notification – it only sends on the change from off to on; combine them through an OR first."
S1_ZU_RANG = "In the evening, before the prices for tomorrow are there, there is no rank (-1). -1 also meets “less or equal” in no. 24; no. 25 only lets a known rank through."
S1_ZU_FREIGABE = "No. 30 adds “Preise nicht verlässlich (Tibber)” inverted – without valid prices or with a stopped LoxBerry there is no release. The switch-on delay no. 31 prevents flicker at the threshold; two minutes are enough, the price only changes hourly."
S1_H_MERKER = "Connect your own loads to the flag “Freigabe Lastverschiebung (Tibber)” (release input of the wallbox, socket of the washing machine, hot water). Without valid prices or with a stopped LoxBerry the release drops out."
S1_H_WEGE = "Two ways to the cheap hour: no. 22 asks for a fixed price (never free on expensive days), no. 24 for the rank (the cheapest hours every day). If you only want one, leave out the other and connect around the OR no. 27."
S1_H_MELDUNG = "The message “gestört” only comes after 10 minutes of fault; “Spotpreis-Plugin meldet sich nicht” (LoxBerry off) after 15 minutes at the earliest."
S1_H_TOKEN = "After “Roll a new token” in the plugin renew the address at the container (or fetch the template again – but then draw all connections again)."
S1_H_ANSAGE = "The announcements “cheapest window starts” and “price fetch disturbed” are spoken by the plugin itself (tab Settings, on by default) – no block is needed for them. If you prefer to build the message in Loxone, take no. 13 to 19 on this page and no. 31 to 33 on the page “Spotpreis Tibber Werte”."
S1_H_LEVEL = "If you want to release by the thresholds of the plugin (LEVEL 0 = cheap): an “Equal” at TIBBER_LEVEL with V2 = 0 as a third way through a further OR in front of no. 29 (not a block of the sample project)."
S1_H_GRENZE = "Deliberately not in the list: the requests aktion=stunden, verbrauch, pulse and json (several lines or JSON – no command for a virtual input) and the MQTT way (off by default; a second way would give duplicate inputs)."
S2_SCHRITT1 = "In the plugin tab “Scheduler”, section “The switching rules”, set up one rule per device (e.g. rule 1 “Wallbox”: 4 hours between 18 and 7 o’clock, 11 kW; rule 2 “Warmwasser”: 2 hours; rule 3 “Waschmaschine”: 3 hours in one go) and switch it on. Without a rule switched on the page stays at “nichts geplant”."
S2_SCHRITT2 = "Use the container “Spotpreis Tibber” from the page “Spotpreis Tibber” (step 2) – do not import it again."
S2_SCHRITT3 = "New page “Spotpreis Tibber Steuerung”, drag the 25 commands of the list (no. 1–25; TIBBER_ZAEHLER once more), plus the constant 1 (no. 26)."
S2_SCHRITT4 = "The other blocks via F5, parameters as in the list; an AND has two inputs; “(inverted)” means: click on the input point I2 until it shows a small circle (not a tick in the properties window). Value Validator no. 27: remove the tick at ‘En’ in the properties window. Click “+” three times on every status first (V5–V7); enter the status lines by hand, the one without condition last."
S2_SCHRITT5 = "Connect your own device to output Q of “Regel 1 schaltet (Tibber)” … “Regel 4 schaltet (Tibber)” (switching actuator, release of the wallbox, SG Ready input). Leave out rules you do not need together with their six commands, their AND and their status."
S2_SCHRITT6 = "Save and transfer. Check: the status “Schaltregel 1 (Tibber)” shows “wartet – Start in … Stunden” and the same hour as the preview in the plugin (tab “Scheduler”)."
S2_ZU_STEHT = "If the LoxBerry stops, every input keeps its last value – R1 to R4 too; only the stopped run counter gives it away. That is why the switching outputs hang on the Value Validator."
S2_ZU_DIGITAL = "R1 to R4 are already digital (0/1) – no threshold switch in front."
S2_H_AUSFALL = "The schedule keeps running in the plugin even if a single price fetch fails – the prices of today and tomorrow are already there. Only if the LoxBerry no longer answers does Loxone switch the devices off after 15 minutes (otherwise they would stay at the last state)."
S2_H_SPERRE = "“Sperre” and “verdrängt” explain why a rule is NOT running right now: enough sun expected, storage too empty or too full, or the power budget was taken by a higher-ranked rule."
S2_H_WECHSEL = "The rule numbers and the names R1 … R4 are the same as in Spotpreis aWATTar and Octopus – the page stays the same when changing the provider, only the commands come from the other container (with Octopus “until start” and “remaining” count minutes)."
S2_H_LAUFEN = "If you prefer a device to keep running during an outage (e.g. a heat pump lock), connect R1 … R4 directly to the device instead of through the AND."
S3_SCHRITT1 = "Use the container “Spotpreis Tibber” from the page “Spotpreis Tibber” (step 2) – do not import it again."
S3_SCHRITT2 = "New page “Spotpreis Tibber Werte”, drag the 26 commands of the list (no. 1–26)."
S3_SCHRITT3 = "Create two notifications (Periphery → Messages → Notification): “Meldung günstiges Fenster (Tibber)” and “Meldung Preise für morgen (Tibber)”, text as in the list."
S3_SCHRITT4 = "The other blocks via F5. “+”: “Strompreise heute (Tibber)” four times, “Strompreise morgen (Tibber)” twice, “Günstigstes Fenster (Tibber)” four times. At the “Equal” no. 31 leave the second input open and enter V2 = 0. Enter the status lines by hand, the one without condition last."
S3_SCHRITT5 = "Save and transfer. Check: “Strompreise heute (Tibber)” names the same hours as the hourly list in the plugin (tab “Test” → “Hourly prices”)."
S3_ZU_FENSTER = "FENSTER_IN is rounded to full hours – 0 means “running” or “starts in less than 30 minutes”. The switch-on delay no. 32 swallows a possible pulse at every poll."
S3_ZU_MORGEN = "MORGEN_OK is already digital – the notification hangs directly on it and sends once when the prices arrive."
S3_H_FENSTER = "The window length (3 hours by default) is set in the plugin (tab Settings). “Fenster beginnt” reports up to 30 minutes before the start – the plugin rounds to full hours."
S3_H_MORGEN = "If you do not want the daily message “Preise für morgen”, leave out no. 34."
S3_H_QUELLE = "PV forecast and storage level only arrive if a source is entered in the plugin (tab “Scheduler”, e.g. forecast.solar or the endpoint of a storage plugin); otherwise 0 is shown."
S3_H_STRICH = "If there is no second window any more, a dash comes – the input then keeps its last value, and the status may show an old second window."
S4_SCHRITT1 = "Only with a Tibber Pulse: in the plugin tab “Settings” switch on “Fetch real time values from the Tibber Pulse”; tab “Test” → “Real time values from the Tibber Pulse” ticked. Without a Pulse leave out no. 1–11."
S4_SCHRITT2 = "Enter your own fixed price in the plugin (tab “Settings”, “Fixed price for comparison”, 34 ct/kWh by default) – it is the reference of the tariff comparison."
S4_SCHRITT3 = "New page “Spotpreis Tibber Verbrauch”, drag the 16 commands of the list (TIBBER_CUR once more); switch on “Statistics” at TIBBER_PULSE in the properties window."
S4_SCHRITT4 = "Create two notifications: “Meldung Pulse liefert nicht (Tibber)” and “Meldung teurer als Festpreis (Tibber)”, text as in the list."
S4_SCHRITT5 = "The other blocks via F5; enter the formula no. 7 as in the list. “+”: “Pulse jetzt (Tibber)” and “Verbrauch und Kosten (Tibber)” twice each. Enter the status lines by hand, the one without condition last."
S4_SCHRITT6 = "Save and transfer. Check: “Pulse jetzt (Tibber)” shows the same power as the Tibber app."
S4_ZU_IMPULS = "A threshold switch behind a polled input gives a short pulse at every poll; the switch-on delay in front of the message swallows it."
S4_ZU_KOSTEN = "Power in kW times final price gives the cost per hour in ct – so you can see which load really costs money."
S4_H_KONTO = "Consumption and cost come from the Tibber account (every 3 hours), not from the Pulse – they are there without a Pulse too."
S4_H_VORZEICHEN = "“Saved” has two signs: ERSPARNIS_GESTERN positive = saved, DIFF_MONAT and EURO_MONAT negative = saved (that is how the plugin calculates)."
S4_H_OHNE = "Without a Pulse the status “Pulse jetzt (Tibber)” shows 0 everywhere – “0 s old” then cannot be told apart from “never”."
S4_H_STATISTIK = "Statistics is a property of the input, not a block. The cost per hour as a history is only available if you feed it into your own virtual input or memory flag with statistics – not in the sample project."
S5_SCHRITT1 = "Nothing to set in the plugin: from plugin 0.9.32 the template “Spotpreis Tibber” brings the 24 hourly prices TIBBER_PH00 to TIBBER_PH23 (container from the page “Spotpreis Tibber”, step 2). If the template was imported before: create the 24 commands in the container by hand (title exactly like this, command recognition as in the table in step 3 above, MinVal -100, MaxVal 200) instead of reading in the template a second time."
S5_SCHRITT2 = "New page “Spotpreis Tibber Stundenprofil”, drag the 24 commands (no. 1–24). Set “Pulse at” no. 25 to 00:05:00."
S5_SCHRITT3 = "Place the Spot Price Optimizer no. 26 via F5. In the properties window select the mode “Absolute” – Config then warns “Spot Market Mode is strongly recommended”; confirm the warning with “Yes”. Only in the mode “Absolute” do the inputs 00:00 to 23:00 exist. Formula field empty, demand 4 h, period 24 h, minimum runtime 1 h."
S5_SCHRITT4 = "Connect by hand (the connection tool does not know the block): the inputs 00:00 to 23:00 in order with TIBBER_PH00 to TIBBER_PH23, Tr with output Q of no. 25; click “+” once on the status no. 27, then the outputs Cv, Min, Max, Avg and O to V1 to V5. Connect output O to your own load."
S5_SCHRITT5 = "Save and transfer. Check: the status “Stundenprofil (Tibber)” names the same price for the current hour as “Strompreis jetzt (Tibber)”."
S5_ZU_OPT = "The connection tool of the sample project does not know the Spot Price Optimizer; its 30 connections (24 hours, Tr, five to the status) are drawn by hand."
S5_H_SPOTMARKT = "Alternative without the plugin: mode “Spot market” – Loxone then fetches the exchange prices itself (without taxes, grid fees and your own surcharge), and this page needs none of the 24 commands. Tibber on the other hand delivers the final price you really pay."
S5_H_CT = "The prices arrive in ct/kWh; the order of the hours stays the same, only the parameter “Max” is then in ct."
S5_H_VIERTEL = "If Tibber delivers quarter-hour prices, each hourly value holds the mean of the four quarters. The switching rules of the page “Spotpreis Tibber Steuerung” switch more finely – if you use them, you do not need this page."
S5_H_STRICH = "If the price of an hour is missing (clock change, no prices), a dash comes – the input then keeps its last value. The prices for tomorrow are not wired: the block only has 24 inputs for the current day."
HAUSFORM_V2 = "New setups take the values via the <b>MQTT gateway V2</b>: tab <i>MQTT</i> lists the data points to tick with their names in Loxone (virtual input, not a virtual HTTP input). The HTTP way below stays for existing setups."
ENDPUNKT_AUS = "The HTTP endpoint is switched off – the HTTP template below only gets <span class='sm-mono'>ENDPUNKT_AUS</span>. Switch it on in tab <i>MQTT</i>."

