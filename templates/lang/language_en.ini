NICHT_GEFUNDEN = "No MQTT section found in the LoxBerry general.json. From LoxBerry 3 onwards it should be there — please check under System → MQTT Gateway."
PLATZHALTER = "A reading the plugin does not have goes out as -1 — not as 0 and not as an old value. Excepted are values for which -1 is a real number (prices, Pulse power, differences and savings): they are then not sent at all, and Loxone keeps the previous value. Topics switched off by a setting (Pulse, consumption, PV or storage source, rules) are not sent at all."
THEMEN_ERKLAERUNG = "The fetch sends the values through the UDP input of the gateway. The plugin therefore needs no broker credentials of its own; the gateway has them anyway."
T_AUTOSTART = "Gateway autostart"
