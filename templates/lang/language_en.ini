PREIS_ERKLAERUNG = "<b>Tibber delivers the final price ready made</b> — including taxes and levies. Unlike an exchange price nothing has to be added up here. The surcharge below is only meant for the case that Tibber does not include something; it defaults to 0. The energy share and the tax share are carried separately: <b>only the energy share can go negative</b>, never the final price."
PULSE_ERKLAERUNG = "Requires a <b>Tibber Pulse</b> or <b>Watty</b> at the meter. Without that hardware Tibber supplies no instantaneous values — this is not a malfunction of the plugin, and the Test tab says so explicitly. The values arrive over a persistent connection, which is why a separate service runs for them."
