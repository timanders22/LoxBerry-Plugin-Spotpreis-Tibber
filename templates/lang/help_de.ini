; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Spotpreis Tibber"
K02 = "Holt die stündlichen Strompreise aus dem eigenen <b>Tibber-Konto</b>, dazu die Verbrauchshistorie und — mit einer <b>Tibber Pulse</b> — die Momentanleistung im Sekundentakt. Alles geht an Loxone: über MQTT und über einen tokengeschützten HTTP-Endpunkt."
K03 = "Was zuerst"
K04 = "<b>Token holen.</b> Unter <span class='sm-mono'>developer.tibber.com</span> mit dem eigenen Tibber-Konto anmelden, dann unter <i>Access Token</i> eines erzeugen."
K05 = "<b>Einstellungen:</b> Token eintragen und speichern."
K06 = "<b>Test, Knopf <i>Kontodaten prüfen</i>.</b> Das ist der wichtigste Klick: Er sagt in einer Zeile, ob das Token angenommen wird, wie das Zuhause heißt und ob eine Pulse angeschlossen ist."
K07 = "<b>Test, Knopf <i>Preise sofort holen</i></b> — sonst wartet man bis zum nächsten Takt."
K08 = "<b>MQTT:</b> Das Abo im Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K09 = "<b>Einbindung in Loxone:</b> Importdatei erzeugen, Bausteine nachbauen."
K10 = "Der Unterschied zu aWATTar und Octopus"
K11 = "<b>Tibber liefert den Endpreis fertig</b> — inklusive Steuern und Abgaben. Bei einem Börsenpreis muss man Netzentgelt, Stromsteuer, Umlagen und Umsatzsteuer selbst aufschlagen; hier nicht. Deshalb gibt es keinen Preisrechner, sondern nur einen <i>Aufschlag</i>, der ab Werk auf 0 steht."
K12 = "Der <b>Energieanteil</b> und der <b>Steueranteil</b> werden trotzdem einzeln mitgeführt. Das ist kein Beiwerk: <b>negativ werden kann nur der Energieanteil</b>, nie der Endpreis. Wer auf negative Preise reagieren will, wertet <span class='sm-mono'>NEG</span> aus, nicht <span class='sm-mono'>CUR</span>."
K13 = "Die Feldnamen für Loxone sind, wo es dieselben Größen sind, <b>dieselben wie in den Plugins Spotpreis aWATTar und Octopus</b>. Wer den Anbieter wechselt, tauscht das Plugin — nicht die Bausteine."
K14 = "Zwei Preisniveaus, und warum"
K15 = "<span class='sm-mono'>LEVEL</span> ist das Niveau nach <b>Ihren</b> Schwellen (günstig / normal / teuer). <span class='sm-mono'>TLEVEL</span> ist das, was <b>Tibber selbst</b> daraus macht — Tibber vergleicht mit den letzten Tagen, Sie vergleichen mit einer festen Zahl. An einem durchweg teuren Tag sagt Tibber trotzdem irgendwann „günstig“, Ihre Schwelle nicht. Beides ist nützlich, deshalb gibt es beides."
K16 = "Die Tibber Pulse"
K17 = "Die Momentanwerte kommen über eine <b>dauerhafte Verbindung</b>, nicht über einen Abruf. Dafür läuft ein eigener Dienst, den man im Reiter <i>Einstellungen</i> startet. Ohne Pulse oder Watty gibt es diese Werte nicht — das ist <b>keine Fehlfunktion</b>, und der Reiter Test sagt es ausdrücklich statt ein Kreuz zu setzen."
K18 = "Ein Pulse-Wert, der älter als zwei Minuten ist, wird <b>nicht mehr ausgegeben</b>. Eine Momentanleistung von vor drei Stunden ist keine Momentanleistung."
K19 = "Tarifvergleich"
K20 = "Der Durchschnittspreis des Monats wird aus <b>Kosten geteilt durch Verbrauch</b> gebildet, nicht als Mittelwert der Stundenpreise. Das ist der Unterschied zwischen „was hätte es gekostet“ und „was hat es gekostet“: Wer nachts wäscht, zahlt weniger als den Tagesmittelwert, und genau das soll der Vergleich zeigen."
K21 = "Der <b>Grundpreis geht nicht ein</b>. Verglichen werden Arbeitspreise; er steht nur im Monatsbericht daneben."
K22 = "Was ungeprüft ist"
K23 = "Diese Fassung ist an <b>keinem</b> Tibber-Konto gemessen worden. Belegt sind die Rechenwege — sie laufen im Selbsttest gegen feste Prüfwerte — und der WebSocket-Nachbau, dessen Rahmenbau gegen eine unabhängige Umsetzung von RFC 6455 gehalten wurde. Nicht belegt ist, ob das Token angenommen wird und ob die Feldnamen dieser Fassung der Schnittstelle noch entsprechen. Der Knopf <i>Kontodaten prüfen</i> beantwortet das in einer Zeile."
