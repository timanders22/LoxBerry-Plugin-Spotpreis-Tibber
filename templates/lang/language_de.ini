ADRESSE_VORSCHLAG = "Die Adresse oben ist ein <b>Vorschlag</b>. Der Rechnername, unter dem der Browser gerade zugreift, muss nicht derselbe sein, unter dem der Miniserver den LoxBerry erreicht. Im Zweifel die feste IP-Adresse des LoxBerry eintragen."
EINLEITUNG = "Diese Seite baut die Anbindung Schritt für Schritt auf. Wer sie von oben nach unten abarbeitet, hat am Ende einen Miniserver, der den Strompreis kennt, günstige Stunden erkennt und Verbraucher danach freigibt."
EP_JSON = "Alles auf einmal als JSON — für eigene Auswertungen, nicht für einen virtuellen Eingang"
EP_PULSE = "Momentanwerte der Tibber Pulse. OK=0 heißt: der letzte Wert ist älter als zwei Minuten und gilt nicht mehr."
EP_STATUS = "Alle Kennzahlen in einer Zeile. Das ist die Adresse für den virtuellen Eingang."
EP_STUNDEN = "Alle Stundenpreise von heute und morgen, eine Zeile je Stunde"
EP_VERBRAUCH = "Tagesverbrauch und Kosten aus der Tibber-Historie"
H_TITEL = "Einbindung in Loxone"
IMPORT_WARNUNG = "<b>Loxone Config legt beim Import neu an und überschreibt nichts.</b> Zweimal importiert heißt doppelte Objekte. Vor einem zweiten Import die alten löschen."
K_TOKEN_NEU = "Neues Merkwort würfeln"
K_VORLAGE = "Importdatei für Loxone Config erzeugen"
S1_TEXT = "Es gibt zwei Wege, und sie schließen sich nicht aus. <b>MQTT ist der Regelweg:</b> das Gateway erzeugt die Namen der virtuellen Eingänge selbst, in Loxone genügt ein passend benannter Eingang. <b>Der HTTP-Endpunkt</b> liefert alle Kennzahlen in einer einzigen Abfrage und ist deshalb oft übersichtlicher — außerdem gibt es dort die Stundenliste und die Verbrauchshistorie, die über MQTT nur teilweise ankommen. Wer nur den aktuellen Preis braucht, nimmt MQTT; wer den Tagesverlauf auswertet, den Endpunkt."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn der MQTT-Weg benutzt wird. Im LoxBerry unter <b>System → MQTT Gateway</b> dieses Abo eintragen:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_WARNUNG = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b>"
S3_BEFEHLE = "<p>Die Befehlserkennungen für den virtuellen Eingang. Der Knopf unten erzeugt sie fertig als Importdatei — die Tabelle bleibt trotzdem stehen, denn sie erklärt, was importiert wird.</p>"
S3_STRICH = "Ein <b>Strich</b> statt einer Zahl bedeutet: dieser Wert liegt nicht vor. Es wird bewusst keine 0 gesendet, denn eine 0 wäre eine stille Falschaussage — bei einem Strompreis besonders, weil 0 ct nach einem sehr guten Preis aussieht. Loxone behält bei einem Strich den letzten Wert."
S3_TEXT = "In Loxone Config einen <b>Virtuellen HTTP Eingang</b> anlegen. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S4_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist durch ein Merkwort geschützt. Verglichen wird mit <span class='sm-mono'>hash_equals</span>, also in gleichbleibender Zeit. <b>Er ist rein lesend</b> — es gibt hier nichts zu schalten, und ein Endpunkt im unangemeldeten Bereich, der mehr könnte als lesen, wäre eine Angriffsfläche ohne Gegenwert."
S4_TITEL = "Schritt 4: Die Endpunkte im Überblick"
S4_TOKEN = "<p><b>Ein neues Merkwort macht alle Adressen im Miniserver ungültig.</b> Nach dem Würfeln müssen sie in Loxone Config von Hand nachgezogen werden. Deshalb nur würfeln, wenn das Merkwort wirklich abhandengekommen ist.</p>"
S5_TEXT = "Virtuelle Eingänge behalten in Loxone ihren letzten Wert. Fällt der Abruf aus, sieht in der App deshalb alles normal aus — der Preis steht nur still, und eine Automatik würde weiter auf einen Preis von gestern regeln. Zwei Werte verraten es: <span class='sm-mono'>ALTER</span> steigt, und <span class='sm-mono'>OK</span> fällt auf 0. Beide gehören ausgewertet, siehe Bausteine 7 bis 13. <b>Die Schwelle deutlich über den Abruftakt legen</b>, damit ein einzelner verpasster Lauf nichts auslöst."
S5_TITEL = "Schritt 5: Ausfallerkennung"
S6_ERLAEUTERUNG = "<h3>Zu den einzelnen Zeilen</h3><p><b>Zu 9 und 10:</b> Zwei verschiedene Fehlerbilder. #9 heißt: der Abruf läuft, holt aber keine frischen Preise mehr. #10 heißt: der letzte Abruf ist ausdrücklich misslungen. Beide führen zur selben Meldung und werden deshalb in #11 zusammengeführt.</p><p><b>Zu 11:</b> <b>Niemals mehrere Quellen unmittelbar an den Eingang des Benachrichtigungs-Bausteins legen.</b> Er sendet nur beim Wechsel von Aus auf Ein; eine dauerhaft aktive Quelle verschluckt sonst alle übrigen. Erst über ODER zusammenführen.</p><p><b>Zu 15 und 17:</b> Zwei Wege zur selben Frage, und sie beantworten sie verschieden. #15 fragt nach einem absoluten Preis — gut, wenn eine Anlage sich erst unter einem bestimmten Preis rechnet. #17 fragt nach dem Rang — gut, wenn ohnehin gewaschen werden muss und nur der beste Zeitpunkt des Tages gesucht ist. An einem teuren Tag liefert #15 nie eine Freigabe, #17 immer eine. Deshalb sind beide da und werden über ODER verknüpft; wer nur eines will, lässt das andere weg.</p><p><b>Zu 20:</b> Der dritte Eingang ist die Ausfallerkennung, negiert. Ohne ihn würde bei ausgefallenem Abruf auf einen alten Preis hin freigegeben.</p><p><b>Zu 21:</b> Die Einschaltverzögerung verhindert Flattern an der Schwelle. Zwei Minuten genügen; der Preis wechselt ohnehin nur stündlich.</p><p><b>Zu 23 und 24:</b> <span class='sm-mono'>FENSTER_IN</span> zählt die Stunden bis zum günstigsten Fenster. Wird der Wert 0, beginnt es gerade — daraus wird ein Impuls, mit dem sich eine Maschine starten oder eine Meldung schicken lässt.</p><p><b>Zu 28 bis 30:</b> Nur sinnvoll mit Tibber Pulse. Momentanleistung mal Endpreis ergibt die Kosten je Stunde in ct — als Statistik geführt zeigt das, welcher Verbraucher tatsächlich Geld kostet. Ohne Pulse entfallen diese drei Zeilen.</p><p><b>Loxone-Zeitrechnung:</b> Loxone zählt Sekunden seit dem 01.01.2009. Liefert ein Zeit-Baustein Unix-Zeit (ein Wert um 1,7 Milliarden), sind <span class='sm-mono'>1230768000</span> abzuziehen.</p><p>Alle Bausteine findet Loxone Config über die Baustein-Suche mit <b>F5</b>.</p>"
S6_TEXT = "<b>Pflichtteil.</b> Wer diese Tabelle von oben nach unten abarbeitet, hat die Funktion nachgebaut, ohne nachzudenken. Die Zeilen 1 bis 13 sind Werte und Ausfallerkennung und lohnen sich immer. Die Zeilen 14 bis 27 geben Verbraucher zu günstigen Zeiten frei. Die Zeilen 28 bis 30 brauchen eine Tibber Pulse und können sonst entfallen."
S6_TITEL = "Schritt 6: Komplette Baustein-Liste zum Nachbauen"
S7_TEXT = "Diese drei Adressen im Browser aufrufen. Die erste muss Werte liefern, die anderen beiden müssen abgewiesen werden. Wird eine der letzten beiden beantwortet, stimmt etwas mit dem Endpunkt nicht."
S7_TITEL = "Schritt 7: Gegenprobe"
