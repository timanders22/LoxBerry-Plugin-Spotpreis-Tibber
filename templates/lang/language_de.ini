[SCHWELLE]
TITEL = "Schwellen-Push (unabhängig von den Stunden)"
EIN = "Schwellen-Push einschalten"
CT = "Schwelle in ct/kWh"
HYST = "Hysterese in ct/kWh"
SPERRE = "Sperrzeit in Minuten (je Richtung)"
H_EIN = "Meldet einmal, wenn der Preis unter die Schwelle fällt (Feld SCHWELLE_MELDUNG_UNTER, MQTT schwelle/meldung_unter), und einmal, wenn er wieder über Schwelle + Hysterese steigt (SCHWELLE_MELDUNG_UEBER, schwelle/meldung_ueber) – je fünf Minuten lang 1. Den Push verschickt der Miniserver: einen Benachrichtigungsbaustein an diesen Eingang hängen (Reiter „Einbindung in Loxone“). SCHWELLE_UNTER bzw. schwelle/unter (zurückbehalten) steht auf 1, solange der Preis unter der Schwelle liegt. Ab Werk aus; nach dem Einschalten und nach jeder Änderung von Schwelle oder Hysterese wird der Ausgangszustand ohne Meldung übernommen – gemeldet wird erst ein Wechsel."
H_CT = "Gemeldet wird, sobald der Preis kleiner ist als dieser Wert. -100 bis 200."
H_HYST = "„Wieder über“ erst, wenn der Preis größer ist als Schwelle + Hysterese – gegen Flattern um die Schwelle. 0 bis 50."
H_SPERRE = "Nach einer Meldung kommt in dieser Zeit keine zweite derselben Richtung; der Zustand folgt dem Preis trotzdem. 0 (keine Sperre) bis 1440."
