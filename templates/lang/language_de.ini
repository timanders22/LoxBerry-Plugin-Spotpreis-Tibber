T_EINGAENGE = "Eingänge verbinden mit"
T_EINHEIT = "Einheit"
T_ERWARTUNG = "Erwartete Antwort"
T_GRENZEN = "Grenzen"
T_NAMENSVORSCHLAG = "Name (Vorschlag)"
T_PARAMETER = "Parameter"
T_PRUEFUNG = "Aufruf"
T_TITEL = "Titel"
T_TOKEN = "Merkwort"
T_ZYKLUS = "Abfragezyklus"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
ZU = "Zu %s:"
BILD_ALT = "Bausteine der Seite „%s“ in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
S1_SCHRITT1 = "Im Plugin Reiter „Einstellungen“ das Tibber-Token eintragen (developer.tibber.com), speichern. Reiter „Test“ → „Preise sofort holen“, dann „Ist ein Tibber-Token hinterlegt?“ und „Sind die Preise aktuell?“: beide mit Haken."
S1_SCHRITT2 = "Oben in Schritt 3 „Importdatei für Loxone Config erzeugen“. In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren. Nur EINMAL einlesen (zweimal ergibt doppelte Eingänge). Der Behälter „Spotpreis Tibber“ bringt alle %d Werte mit und dient allen fünf Seiten. Steht in der Adresse ein Rechnername, den der Miniserver nicht kennt: die feste IP des LoxBerry eintragen."
S1_SCHRITT3 = "Seite „Spotpreis Tibber“ anlegen. Aus dem Behälter die 11 Befehle der Liste ziehen (Nr. 1–11), dazu die Konstante 1 (Nr. 12). An TIBBER_CUR im Eigenschaftsfenster „Statistik“ einschalten."
S1_SCHRITT4 = "Zwei Schieberegler („Preisgrenze für Freigabe (Tibber)“, „Rang-Grenze (Tibber)“) und einen Schalter („Lastverschiebung freigegeben (Tibber)“) als Virtuelle Eingänge anlegen – Werte wie in der Liste. Den Merker „Freigabe Lastverschiebung (Tibber)“ anlegen (im Baum „Merker“, Menüband „Merker“, auf die Seite klicken). Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung Spotpreis gestört (Tibber)“ und „Meldung Strompreis negativ (Tibber)“, Text wie in der Liste."
S1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden; ODER und UND haben je zwei Eingänge. „(negiert)“ heißt: in Config auf den Eingangspunkt des UND klicken – danach zeigt er einen kleinen Kreis (das ist kein Haken im Eigenschaftsfenster; einen Haken gibt es nur bei Parameter-Eingängen wie ‚En‘). Analogwertvalidierung Nr. 15: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). Status „Strompreis jetzt (Tibber)“: vorher viermal „+“ (V5–V8), „Spotpreis-Zustand (Tibber)“ zweimal (V5, V6). Statuszeilen und Mitteilungstexte stehen in der Tabelle und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt."
S1_SCHRITT6 = "Speichern und übertragen. Probe: „Spotpreis-Zustand (Tibber)“ zeigt „läuft – Preise … min alt“; TIBBER_ZAEHLER zählt alle 5 Minuten um etwa 5 weiter. Schalter „Lastverschiebung freigegeben (Tibber)“ einschalten – in einer günstigen Stunde geht der Merker nach 2 Minuten auf 1."
S1_ZU_IMPULS = "Ein Schwellwertschalter hinter einem abgefragten Eingang gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung Nr. 18 vor der Meldung schluckt ihn."
S1_ZU_STEHT = "Steht der LoxBerry, behalten alle Eingänge ihren letzten Wert – auch OK und ALTER; nur der stehende Laufzähler verrät es. Deshalb hängen Meldung und Freigabe an der Analogwertvalidierung."
S1_ZU_ODER = "Nie mehrere Quellen unmittelbar an den Eingang einer Benachrichtigung legen – sie sendet nur beim Wechsel von Aus auf Ein; erst über ODER zusammenführen."
S1_ZU_RANG = "Abends, bevor die Preise für morgen da sind, gibt es keinen Rang (-1). -1 erfüllt „kleiner oder gleich“ in Nr. 24 ebenfalls; Nr. 25 lässt nur einen bekannten Rang durch."
S1_ZU_FREIGABE = "Nr. 30 nimmt „Preise nicht verlässlich (Tibber)“ negiert dazu – ohne gültige Preise oder bei stehendem LoxBerry gibt es keine Freigabe. Die Einschaltverzögerung Nr. 31 verhindert Flattern an der Schwelle; zwei Minuten genügen, der Preis wechselt nur stündlich."
S1_H_MERKER = "An den Merker „Freigabe Lastverschiebung (Tibber)“ die eigenen Verbraucher hängen (Freigabe-Eingang der Wallbox, Steckdose der Waschmaschine, Warmwasser). Ohne gültige Preise oder bei stehendem LoxBerry fällt die Freigabe ab."
S1_H_WEGE = "Zwei Wege zur günstigen Stunde: Nr. 22 fragt nach einem festen Preis (an teuren Tagen nie frei), Nr. 24 nach dem Rang (jeden Tag die günstigsten Stunden). Wer nur einen will, lässt den anderen weg und legt das ODER Nr. 27 direkt um."
S1_H_MELDUNG = "Die Meldung „gestört“ kommt erst nach 10 Minuten Störung; „Spotpreis-Plugin meldet sich nicht“ (LoxBerry aus) frühestens nach 15 Minuten."
S1_H_TOKEN = "Nach „Neues Merkwort würfeln“ im Plugin die Adresse am Behälter erneuern (oder die Vorlage neu holen – dann aber alle Leitungen neu ziehen)."
S1_H_ANSAGE = "Die Ansagen „günstigstes Fenster beginnt“ und „Preisabruf gestört“ spricht das Plugin selbst (Reiter Einstellungen, ab Werk an) – dafür ist kein Baustein nötig. Wer die Meldung lieber in Loxone baut, nimmt auf dieser Seite Nr. 13 bis 19 und auf der Seite „Spotpreis Tibber Werte“ Nr. 31 bis 33."
S1_H_LEVEL = "Wer nach den Schwellen des Plugins freigeben will (LEVEL 0 = günstig): ein „Gleich“ an TIBBER_LEVEL mit V2 = 0 als dritten Weg über ein weiteres ODER vor Nr. 29 (kein Baustein des Musterprojekts)."
S1_H_GRENZE = "Bewusst nicht in der Liste: die Abfragen aktion=stunden, verbrauch, pulse und json (mehrzeilig bzw. JSON – kein Befehl für einen Virtuellen Eingang) und der MQTT-Weg (ab Werk aus; ein zweiter Weg ergäbe doppelte Eingänge)."
S2_SCHRITT1 = "Im Plugin Reiter „Fahrplaner“, Abschnitt „Die Schaltregeln“, eine Regel je Gerät einrichten (z. B. Regel 1 „Wallbox“: 4 Stunden zwischen 18 und 7 Uhr, 11 kW; Regel 2 „Warmwasser“: 2 Stunden; Regel 3 „Waschmaschine“: 3 Stunden am Stück) und einschalten. Ohne eingeschaltete Regel bleibt die Seite auf „nichts geplant“."
S2_SCHRITT2 = "Den Behälter „Spotpreis Tibber“ aus der Seite „Spotpreis Tibber“ (Schritt 2) nehmen – nicht erneut importieren."
S2_SCHRITT3 = "Neue Seite „Spotpreis Tibber Steuerung“, die 25 Befehle der Liste ziehen (Nr. 1–25; TIBBER_ZAEHLER ein weiteres Mal), dazu die Konstante 1 (Nr. 26)."
S2_SCHRITT4 = "Übrige Bausteine über F5, Parameter wie in der Liste; ein UND hat zwei Eingänge; „(negiert)“ heißt: auf den Eingangspunkt I2 klicken, bis er einen kleinen Kreis zeigt (kein Haken im Eigenschaftsfenster). Analogwertvalidierung Nr. 27: Haken bei ‚En‘ im Eigenschaftsfenster entfernen. Jeder Status vorher dreimal „+“ (V5–V7); Statuszeilen von Hand eintragen, die ohne Bedingung zuletzt."
S2_SCHRITT5 = "An den Ausgang Q von „Regel 1 schaltet (Tibber)“ … „Regel 4 schaltet (Tibber)“ das eigene Gerät legen (Schaltaktor, Freigabe der Wallbox, SG-Ready-Eingang). Nicht gebrauchte Regeln samt ihren sechs Befehlen, ihrem UND und ihrem Status weglassen."
S2_SCHRITT6 = "Speichern und übertragen. Probe: der Status „Schaltregel 1 (Tibber)“ nennt „wartet – Start in … Stunden“ und dieselbe Stunde wie die Vorschau im Plugin (Reiter „Fahrplaner“)."
S2_ZU_STEHT = "Steht der LoxBerry, behalten alle Eingänge ihren letzten Wert – auch R1 bis R4; nur der stehende Laufzähler verrät es. Deshalb hängen die Schaltausgänge an der Analogwertvalidierung."
S2_ZU_DIGITAL = "R1 bis R4 sind schon digital (0/1) – kein Schwellwertschalter davor."
S2_H_AUSFALL = "Der Fahrplan läuft im Plugin weiter, auch wenn ein einzelner Preisabruf misslingt – die Preise von heute und morgen liegen schon vor. Nur wenn der LoxBerry nicht mehr antwortet, schaltet Loxone die Geräte nach 15 Minuten ab (sonst blieben sie auf dem letzten Stand)."
S2_H_SPERRE = "„Sperre“ und „verdrängt“ erklären, warum eine Regel gerade NICHT läuft: genug Sonne erwartet, Speicher zu leer oder zu voll, oder das Leistungsbudget war von einer höher gereihten Regel belegt."
S2_H_WECHSEL = "Die Regelnummern und die Namen R1 … R4 sind dieselben wie in Spotpreis aWATTar und Octopus – die Seite bleibt beim Anbieterwechsel gleich, nur die Befehle kommen aus dem anderen Behälter (bei Octopus zählen „bis Start“ und „Rest“ Minuten)."
S2_H_LAUFEN = "Wer ein Gerät bei einem Ausfall lieber laufen lässt (z. B. eine Sperre der Wärmepumpe), legt R1 … R4 direkt an das Gerät statt über das UND."
S3_SCHRITT1 = "Den Behälter „Spotpreis Tibber“ aus der Seite „Spotpreis Tibber“ (Schritt 2) nehmen – nicht erneut importieren."
S3_SCHRITT2 = "Neue Seite „Spotpreis Tibber Werte“, die 26 Befehle der Liste ziehen (Nr. 1–26)."
S3_SCHRITT3 = "Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Meldung günstiges Fenster (Tibber)“ und „Meldung Preise für morgen (Tibber)“, Text wie in der Liste."
S3_SCHRITT4 = "Übrige Bausteine über F5. „+“: „Strompreise heute (Tibber)“ viermal, „Strompreise morgen (Tibber)“ zweimal, „Günstigstes Fenster (Tibber)“ viermal. Am „Gleich“ Nr. 31 den zweiten Eingang offen lassen und V2 = 0 eintragen. Statuszeilen von Hand eintragen, die ohne Bedingung zuletzt."
S3_SCHRITT5 = "Speichern und übertragen. Probe: „Strompreise heute (Tibber)“ nennt dieselben Stunden wie die Stundenliste im Plugin (Reiter „Test“ → „Stundenpreise“)."
S3_ZU_FENSTER = "FENSTER_IN ist auf volle Stunden gerundet – 0 heißt „läuft“ oder „beginnt in weniger als 30 Minuten“. Die Einschaltverzögerung Nr. 32 schluckt einen etwaigen Impuls je Abfrage."
S3_ZU_MORGEN = "MORGEN_OK ist schon digital – die Benachrichtigung hängt direkt daran und sendet einmal, wenn die Preise kommen."
S3_H_FENSTER = "Die Fensterlänge (ab Werk 3 Stunden) stellt man im Plugin ein (Reiter Einstellungen). „Fenster beginnt“ meldet bis zu 30 Minuten vor dem Beginn – das Plugin rundet auf volle Stunden."
S3_H_MORGEN = "Wer die tägliche Meldung „Preise für morgen“ nicht will, lässt Nr. 34 weg."
S3_H_QUELLE = "PV-Prognose und Speicherstand kommen nur an, wenn im Plugin eine Quelle eingetragen ist (Reiter „Fahrplaner“, z. B. forecast.solar oder der Endpunkt eines Speicher-Plugins); sonst steht dort 0."
S3_H_STRICH = "Gibt es kein zweites Fenster mehr, kommt ein Strich – der Eingang behält dann seinen letzten Wert, und der Status kann ein altes zweites Fenster zeigen."
S4_SCHRITT1 = "Nur mit Tibber Pulse: im Plugin Reiter „Einstellungen“ „Echtzeitwerte der Tibber Pulse holen“ einschalten; Reiter „Test“ → „Echtzeitwerte der Tibber Pulse“ mit Haken. Ohne Pulse Nr. 1–11 weglassen."
S4_SCHRITT2 = "Im Plugin den eigenen Festpreis eintragen (Reiter „Einstellungen“, „Festpreis zum Vergleich“, ab Werk 34 ct/kWh) – er ist die Vergleichsgröße des Tarifvergleichs."
S4_SCHRITT3 = "Neue Seite „Spotpreis Tibber Verbrauch“, die 16 Befehle der Liste ziehen (TIBBER_CUR ein weiteres Mal); an TIBBER_PULSE im Eigenschaftsfenster „Statistik“ einschalten."
S4_SCHRITT4 = "Zwei Benachrichtigungen anlegen: „Meldung Pulse liefert nicht (Tibber)“ und „Meldung teurer als Festpreis (Tibber)“, Text wie in der Liste."
S4_SCHRITT5 = "Übrige Bausteine über F5; die Formel Nr. 7 wie in der Liste eintragen. „+“: „Pulse jetzt (Tibber)“ und „Verbrauch und Kosten (Tibber)“ je zweimal. Statuszeilen von Hand eintragen, die ohne Bedingung zuletzt."
S4_SCHRITT6 = "Speichern und übertragen. Probe: „Pulse jetzt (Tibber)“ zeigt dieselbe Leistung wie die Tibber-App."
S4_ZU_IMPULS = "Ein Schwellwertschalter hinter einem abgefragten Eingang gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung vor der Meldung schluckt ihn."
S4_ZU_KOSTEN = "Leistung in kW mal Endpreis ergibt die Kosten je Stunde in ct – so sieht man, welcher Verbraucher tatsächlich Geld kostet."
S4_H_KONTO = "Verbrauch und Kosten kommen aus dem Tibber-Konto (alle 3 Stunden), nicht von der Pulse – sie stehen auch ohne Pulse da."
S4_H_VORZEICHEN = "„Gespart“ hat zwei Vorzeichen: ERSPARNIS_GESTERN positiv = gespart, DIFF_MONAT und EURO_MONAT negativ = gespart (so rechnet das Plugin)."
S4_H_OHNE = "Ohne Pulse steht im Status „Pulse jetzt (Tibber)“ überall 0 – „0 s alt“ ist dann von „noch nie“ nicht zu unterscheiden."
S4_H_STATISTIK = "Statistik ist eine Eigenschaft des Eingangs, kein Baustein. Die Kosten je Stunde als Verlauf gibt es nur, wenn man sie in einen eigenen Virtuellen Eingang oder Merker mit Statistik führt – nicht im Musterprojekt."
S5_SCHRITT1 = "Im Plugin ist nichts einzustellen: die Vorlage „Spotpreis Tibber“ bringt ab Plugin 0.9.32 die 24 Stundenpreise TIBBER_PH00 bis TIBBER_PH23 mit (Behälter aus der Seite „Spotpreis Tibber“, Schritt 2). Wurde die Vorlage vorher importiert: im Behälter die 24 Befehle von Hand anlegen (Titel genau so, Befehlserkennung wie in der Tabelle in Schritt 3 oben, MinVal -100, MaxVal 200), statt die Vorlage ein zweites Mal einzulesen."
S5_SCHRITT2 = "Neue Seite „Spotpreis Tibber Stundenprofil“, die 24 Befehle ziehen (Nr. 1–24). „Impuls um“ Nr. 25 auf 00:05:00 stellen."
S5_SCHRITT3 = "Den Spotpreis-Optimierer Nr. 26 über F5 setzen. Im Eigenschaftsfenster den Modus „Absolut“ wählen – Config warnt dann „Der Spotmarkt-Modus wird dringend empfohlen“; die Warnung mit „Ja“ bestätigen. Erst im Modus „Absolut“ gibt es die Eingänge 00:00 bis 23:00. Formelfeld leer, Bedarf 4 h, Periode 24 h, Mindestlaufzeit 1 h."
S5_SCHRITT4 = "Von Hand verbinden (das Leitungswerkzeug kennt den Baustein nicht): die Eingänge 00:00 bis 23:00 der Reihe nach mit TIBBER_PH00 bis TIBBER_PH23, Tr mit dem Ausgang Q von Nr. 25; am Status Nr. 27 einmal „+“, dann die Ausgänge Cv, Min, Max, Avg und O an V1 bis V5. Den Ausgang O an den eigenen Verbraucher legen."
S5_SCHRITT5 = "Speichern und übertragen. Probe: der Status „Stundenprofil (Tibber)“ nennt für die laufende Stunde denselben Preis wie „Strompreis jetzt (Tibber)“."
S5_ZU_OPT = "Den Spotpreis-Optimierer kennt das Leitungswerkzeug des Musterprojekts nicht; seine 30 Leitungen (24 Stunden, Tr, fünf zum Status) werden von Hand gezogen."
S5_H_SPOTMARKT = "Alternative ohne Plugin: Modus „Spotmarkt“ – dann holt Loxone die Börsenpreise selbst (ohne Steuern, Netzentgelt und eigenen Aufschlag), und diese Seite braucht keinen der 24 Befehle. Tibber liefert dagegen den Endpreis, den Sie wirklich zahlen."
S5_H_CT = "Die Preise kommen in ct/kWh; die Reihenfolge der Stunden bleibt dieselbe, nur der Parameter „Max“ gilt dann in ct."
S5_H_VIERTEL = "Liefert Tibber Viertelstundenpreise, steht in jedem Stundenwert das Mittel der vier Viertelstunden. Feiner schalten die Schaltregeln der Seite „Spotpreis Tibber Steuerung“ – wer sie nutzt, braucht diese Seite nicht."
S5_H_STRICH = "Fehlt der Preis einer Stunde (Zeitumstellung, keine Preise), kommt ein Strich – der Eingang behält dann seinen letzten Wert. Die Preise für morgen sind nicht verdrahtet: der Baustein hat nur 24 Eingänge für den laufenden Tag."
