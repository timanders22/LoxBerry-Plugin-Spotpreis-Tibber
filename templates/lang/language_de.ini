EINLEITUNG = "Diese Seite baut die Anbindung Schritt für Schritt auf. Wer sie von oben nach unten abarbeitet, hat am Ende einen Miniserver, der den Strompreis kennt, günstige Stunden erkennt und Verbraucher danach freigibt."
