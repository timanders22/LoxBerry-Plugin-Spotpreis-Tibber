V2_ERKLAERUNG = "Unter <b>MQTT-Gateway V2</b> kommt am Miniserver nur an, was in den <i>Subscriptions</i> des Gateways angehakt ist. Diese Tabelle ist die Liste dafür – Thema, Name des virtuellen Eingangs in Loxone und ob <i>Noncached</i> gesetzt sein muss (beim Lebenszeichen, bei „ok“ und bei den Stundenpreisen). Zeitstempel und Werte, die mit Ihren Einstellungen nie gesendet werden (Pulse, Verbrauch, nicht angelegte Regeln), stehen absichtlich nicht darin. Die Zeile im Reiter <i>Test</i> prüft, ob alles angehakt ist."
T_GATEWAYNAME = "Name in Loxone"
T_NONCACHED = "Noncached"
NONCACHED_JA = "ja"
NONCACHED_NEIN = "nein"

[LOX]
ADRESSE_VORSCHLAG = "Die Adresse oben ist ein <b>Vorschlag</b>. Der Rechnername, unter dem der Browser gerade zugreift, muss nicht derselbe sein, unter dem der Miniserver den LoxBerry erreicht. Im Zweifel die feste IP-Adresse des LoxBerry eintragen."
EINLEITUNG = "Diese Seite baut die Anbindung Schritt für Schritt auf. Wer sie von oben nach unten abarbeitet, hat am Ende einen Miniserver, der den Strompreis kennt, günstige Stunden erkennt und Verbraucher danach freigibt."
EP_JSON = "Alles auf einmal als JSON — für eigene Auswertungen, nicht für einen virtuellen Eingang"
EP_PULSE = "Momentanwerte der Tibber Pulse. OK=0 heißt: der letzte Wert ist älter als zwei Minuten und gilt nicht mehr."
EP_STATUS = "Alle Kennzahlen in einer Zeile. Das ist die Adresse für den virtuellen Eingang."
EP_STUNDEN = "Alle Stundenpreise von heute und morgen, eine Zeile je Stunde"
EP_VERBRAUCH = "Tagesverbrauch und Kosten aus der Tibber-Historie"
H_TITEL = "Einbindung in Loxone"
IMPORT_WARNUNG = "<b>Loxone Config legt beim Import neu an und überschreibt nichts.</b> Zweimal importiert heißt doppelte Objekte. Vor einem zweiten Import die alten löschen."
K_TOKEN_NEU = "Neues Merkwort würfeln"
K_VORLAGE = "Importdatei für Loxone Config erzeugen"
S1_TEXT = "Es gibt zwei Wege, und sie schließen sich nicht aus. <b>Der HTTP-Endpunkt ist der Weg der Baustein-Listen</b> (Schritt 6): er liefert alle Kennzahlen in einer einzigen Abfrage, dazu gibt es dort die Stundenliste und die Verbrauchshistorie. <b>MQTT</b> (ab Werk aus) liefert dieselben Werte über das Gateway; das Gateway erzeugt die Namen der virtuellen Eingänge selbst. Nur einen der beiden Wege für dieselben Werte benutzen – zwei ergäben doppelte Eingänge."
S1_TITEL = "Schritt 1: Weg festlegen"
S2_TEXT = "Nur nötig, wenn der MQTT-Weg benutzt wird. Die Themengruppe dieses Plugins lautet:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3_BEFEHLE = "<p>Die Befehlserkennungen für den virtuellen Eingang. Der Knopf unten erzeugt sie fertig als Importdatei — die Tabelle bleibt trotzdem stehen, denn sie erklärt, was importiert wird.</p>"
S3_STRICH = "Ein <b>Strich</b> statt einer Zahl bedeutet: dieser Wert liegt nicht vor. Es wird bewusst keine 0 gesendet, denn eine 0 wäre eine stille Falschaussage — bei einem Strompreis besonders, weil 0 ct nach einem sehr guten Preis aussieht. Loxone behält bei einem Strich den letzten Wert."
S3_TEXT = "In Loxone Config einen <b>Virtuellen HTTP Eingang</b> anlegen. Adresse und Zyklus:"
S3_TITEL = "Schritt 3: Virtuelle Eingänge anlegen"
S4_TEXT = "Der Endpunkt liegt im unangemeldeten Bereich, damit Loxone ihn ohne Zugangsdaten erreicht, und ist durch ein Merkwort geschützt. Verglichen wird mit <span class='sm-mono'>hash_equals</span>, also in gleichbleibender Zeit. <b>Er ist rein lesend</b> — es gibt hier nichts zu schalten, und ein Endpunkt im unangemeldeten Bereich, der mehr könnte als lesen, wäre eine Angriffsfläche ohne Gegenwert."
S4_TITEL = "Schritt 4: Die Endpunkte im Überblick"
S4_TOKEN = "<p><b>Ein neues Merkwort macht alle Adressen im Miniserver ungültig.</b> Nach dem Würfeln müssen sie in Loxone Config von Hand nachgezogen werden. Deshalb nur würfeln, wenn das Merkwort wirklich abhandengekommen ist.</p>"
S5_TEXT = "Virtuelle Eingänge behalten in Loxone ihren letzten Wert. Fällt der Abruf aus, sieht in der App deshalb alles normal aus — der Preis steht nur still, und eine Automatik würde weiter auf einen Preis von gestern regeln. Solange das Plugin antwortet, verraten es zwei Werte: <span class='sm-mono'>ALTER</span> steigt, und <span class='sm-mono'>OK</span> fällt auf 0, sobald der letzte gelungene Abruf älter ist als das Dreifache des Abruftakts (mindestens zwei Stunden). <b>Antwortet der LoxBerry gar nicht, frieren auch ALTER und OK ein</b> – dann verrät es nur der Laufzähler <span class='sm-mono'>ZAEHLER</span>, den eine Analogwertvalidierung überwacht. Alle drei gehören ausgewertet, siehe Seite „Spotpreis Tibber“, Nr. 13 bis 19, in Schritt 6. <b>Die Schwelle deutlich über den Abruftakt legen</b>, damit ein einzelner verpasster Lauf nichts auslöst."
S5_TITEL = "Schritt 5: Ausfallerkennung"
S6_TEXT = "<b>Pflichtteil.</b> Fünf Seiten wie im LoxBerry-Plugins Musterprojekt, jede mit Anleitung, Tabelle, Hinweisen und einem Bild der fertigen Seite. Wer eine Tabelle von oben nach unten abarbeitet, hat die Seite nachgebaut, ohne nachzudenken. „Spotpreis Tibber“ (läuft es, Preis jetzt, Verbraucher in günstigen Stunden freigeben) lohnt sich immer; „Steuerung“ (die vier Schaltregeln des Fahrplaners), „Werte“ (heute, morgen, Fenster), „Verbrauch“ (Tibber Pulse und Konto) und „Stundenprofil“ (Loxone-Baustein Spotpreis-Optimierer) nimmt man nach Bedarf dazu. Alle Seiten nutzen denselben Behälter „Spotpreis Tibber“; ein UND oder ODER hat höchstens zwei Eingänge, und an jedem Eingang hängt genau eine Quelle."
S6_TITEL = "Schritt 6: Die Seiten des Musterprojekts zum Nachbauen"
S7_TEXT = "Diese drei Adressen im Browser aufrufen. Die erste muss Werte liefern, die anderen beiden müssen abgewiesen werden. Wird eine der letzten beiden beantwortet, stimmt etwas mit dem Endpunkt nicht."
S7_TITEL = "Schritt 7: Gegenprobe"
TOKEN_NEU = "Es wurde ein neues Merkwort gewürfelt. Alle Adressen im Miniserver müssen jetzt nachgezogen werden."
