; Spotpreis Tibber - Sprachdatei Deutsch
;
; Regeln (Hausstandard):
;   - JEDER Wert steht in doppelten Anfuehrungszeichen. Bei parse_ini_file
;     beginnt mit ';' ein Kommentar - ein unquotierter Wert wuerde dort
;     abgeschnitten. Das traefe ausgerechnet jede HTML-Entitaet.
;   - Innerhalb eines Wertes steht KEIN weiteres doppeltes Anfuehrungszeichen.
;     HTML-Attribute deshalb einfach quoten: <span class='sm-mono'>.
;   - Umlaute und Sonderzeichen als echte UTF-8-Zeichen, nicht als Entitaeten:
;     ein Teil der Werte laeuft durch tb_e(), und dort wuerde aus einer
;     Entitaet sichtbarer Text statt eines Zeichens. Genau dieser Fehler wurde
;     am 10.08.2026 fuer Docker NG gemeldet - an 16 Stellen.
;   - Jeder im PHP benutzte Schluessel steht in BEIDEN Sprachdateien.

