EINHEIT_WH = "Wh je Zeitabschnitt (forecast.solar)"
ERKLAERUNG = "Bis 0.9.10 konnte dieses Plugin sagen, welche Stunden günstig sind — nicht aber, welches Gerät sie bekommt. Der Fahrplaner ändert drei Dinge: eine Regel kann eine <b>Frist</b> und eine Energiemenge haben, mehrere Regeln teilen sich ein <b>Leistungsbudget</b> nach Rangfolge, und eine <b>PV-Prognose</b> verschiebt den Fahrplan in die Sonnenstunden. Alles drei ist ab Werk aus — wer nichts einstellt, bekommt das Verhalten der Fassung davor."
GESPEICHERT = "Fahrplaner gespeichert."
H_AKTIV = "Ohne Haken bleibt die Regel stehen, wird aber nicht gerechnet und meldet dauerhaft 0. Ihre Einstellungen gehen dabei nicht verloren."
H_BUDGET = "So viel dürfen alle Schaltregeln zusammen gleichzeitig ziehen. Wer mehr will, als noch frei ist, bekommt die Stunde nicht und weicht auf die nächste aus. 0 = aus, dann rechnet jede Regel für sich wie bisher."
H_BUDGET2 = "Für steuerbare Verbrauchseinrichtungen nach §14a EnWG: innerhalb des Zeitfensters darunter gilt zusätzlich diese Grenze, und die kleinere von beiden gewinnt. 0 = aus."
H_BUDGET2_ZEIT = "Gleiche Lesart wie beim Zeitfenster einer Regel: von gleich bis bedeutet ganzer Tag."
H_ENERGIE = "Wie viel die Regel insgesamt braucht. Zusammen mit der Leistung ergibt sich daraus die Zahl der Stunden — dann zählt nicht mehr das Feld „Stunden“. 0 = aus."
H_FRIST = "Bis zu dieser Stunde muss die Regel durch sein. Liegt sie in der Vergangenheit, gilt sie für den Folgetag. -1 = keine Frist. Das ist der Unterschied zwischen „wasche irgendwann günstig“ und „wasche günstig, aber bis sieben“."
H_GLOBAL = "Was für alle Regeln gilt"
H_HORIZONT = "Wie weit nach vorn gesucht wird. Länger als der Horizont plant der Fahrplaner nicht, auch wenn übermorgen billiger wäre."
H_HYSTERESE = "Der Fahrplaner bekommt bei jedem Aufruf eine frische Preisreihe und könnte deshalb jedes Mal anders entscheiden. Mit diesem Haken läuft ein begonnener Block bis zu seinem Ende, auch wenn inzwischen eine Stunde billiger geworden ist. Ohne ihn kann ein Gerät mitten im Betrieb abschalten."
H_LEISTUNG = "Was das Gerät zieht, wenn die Regel läuft. 0 heißt: die Regel nimmt am Leistungsbudget nicht teil und verdrängt niemanden."
H_N = "Bei „günstigstes Fenster“ die Länge des Fensters, bei „günstigste Einzelstunden“ deren Anzahl. Bei den beiden anderen Arten ohne Wirkung."
H_NAME = "Nur für diese Oberfläche. Der Name der Bausteine in Loxone ändert sich davon nicht — der steht in der Importvorlage und darf nicht von einer Einstellung abhängen, die man morgen ändert."
H_NEG = "Negativ ist der Energieanteil, nicht der Endpreis — der enthält Steuern und wird deshalb praktisch nie negativ."
H_PLANFELDER = "Rangfolge, Bedarf und Sperren"
H_PROZENT = "Nur für die Regelart „unter dem Tagesmittel“: um so viel Prozent muss eine Stunde unter dem Mittel liegen, damit die Regel läuft."
H_PV_BONUS = "Wird vom Preis einer Stunde abgezogen, wenn für sie eine PV-Prognose vorliegt. Damit gewinnt die sonnige Mittagsstunde gegen die billige Nachtstunde. Ein sinnvoller Wert ist der Unterschied zwischen Bezugspreis und Einspeisevergütung — das, was Sie sparen, wenn Sie den Strom selbst verbrauchen. 0 = aus."
H_PV_EINHEIT = "Was in einem Wert steht: eine Energiemenge je Zeitabschnitt oder eine mittlere Leistung. Falsch gewählt rechnet der Fahrplaner um den Faktor Tausend daneben."
H_PV_FELDER = "Nur für die Form „Liste von Sätzen“. Bei Solcast heißen sie <span class='sm-mono'>period_end</span> und <span class='sm-mono'>pv_estimate</span>."
H_PV_PFAD = "Mit Punkten getrennt, etwa <span class='sm-mono'>forecasts</span> oder <span class='sm-mono'>result.watt_hours_period</span>. Bei forecast.solar bleibt das Feld leer — der Pfad steht dort fest."
H_PV_QUELLE = "Welche Form die Antwort hat. Es gibt keine gemeinsame Sprache für PV-Prognosen, deshalb drei Formen statt einer."
H_PV_SCHWELLE = "Die Gutschrift steigt linear bis zu diesem Wert und bleibt dann stehen. Eine reine Ja-Nein-Schwelle wäre eine Klippe — der Fahrplan spränge bei einer geringfügig geänderten Prognose um Stunden."
H_PV_SPERRE = "Übersteigt die Prognose für die nächsten 24 Stunden diesen Wert, schweigt die Regel. Damit lädt der Speicher nicht nachts auf Vorrat, wenn morgen die Sonne scheint. 0 = aus."
